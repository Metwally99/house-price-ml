<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Predictor</title>
    <style>
        :root {
            --primary: #4361ee;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #212529;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        input:focus,
        select:focus {
            border-color: var(--primary);
            outline: none;
        }

        button {
            width: 100%;
            padding: 1rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 1rem;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
        }

        .result {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #f1f3f5;
            border-radius: 8px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🏠 House Price Predictor</h1>

        <div class="form-group">
            <label for="model_type">Select Model Type</label>
            <select id="model_type">
                <option value="C" selected>Model C: Deep NN (Recommended)</option>
                <option value="B">Model B: Shallow NN</option>
                <option value="A">Model A: Linear Regression</option>
                <option value="D">Model D: Wider NN (64 units)</option>
                <option value="E">Model E: Deeper NN (3 Layers)</option>
            </select>
        </div>

        <!-- Features: ['date', 'age', 'distance', 'stores', 'latitude', 'longitude'] -->
        <div class="form-group">
            <label>Year of Sale</label>
            <input type="number" id="date" value="2013" placeholder="e.g. 2013">
        </div>
        <div class="form-group">
            <label>House Age (Years)</label>
            <input type="number" id="age" value="10" placeholder="e.g. 15">
        </div>
        <div class="form-group">
            <label>Distance to Station</label>
            <input type="number" id="distance" step="0.1" value="500" placeholder="e.g. 300">
        </div>
        <div class="form-group">
            <label>Number of Stores</label>
            <input type="number" id="stores" value="5" placeholder="e.g. 4">
        </div>
        <div class="form-group">
            <label>Latitude</label>
            <input type="number" id="latitude" step="0.01" value="24.9" placeholder="e.g. 24.97">
        </div>
        <div class="form-group">
            <label>Longitude</label>
            <input type="number" id="longitude" step="0.01" value="121.5" placeholder="e.g. 121.54">
        </div>

        <button onclick="predict()">Make Prediction</button>

        <div id="result" class="result">
            Predicted Price: $<span id="priceValue">0</span>
        </div>
    </div>

    <script>
        async function predict() {
            const btn = document.querySelector('button');
            const resultDiv = document.getElementById('result');

            btn.textContent = 'Calculating...';
            btn.disabled = true;

            const data = {
                model_type: document.getElementById('model_type').value,
                date: document.getElementById('date').value,
                age: document.getElementById('age').value,
                distance: document.getElementById('distance').value,
                stores: document.getElementById('stores').value,
                latitude: document.getElementById('latitude').value,
                longitude: document.getElementById('longitude').value
            };

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    resultDiv.style.display = 'block';
                    // result.price is roughly in dollars based on dataset? 
                    // Or maybe it's in 10000s New Taiwan Dollar based on 'common' UCI dataset? 
                    // The dataset says 14264, etc. It's likely unit price or total. 
                    // We'll just display the number formatted.
                    document.getElementById('priceValue').textContent = result.price.toFixed(2);
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                console.error(error);
                alert('Failed to connect to server.');
            }

            btn.textContent = 'Make Prediction';
            btn.disabled = false;
        }
    </script>
</body>

</html>
